name: Build Blueprint APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Ensure V1 and V2 signatures on debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --out "$APK.v1v2" "$APK"
          mv "$APK.v1v2" "$APK"

      - name: Diagnose APK package, signature, and alignment
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "=== APK file ==="
          ls -lh "$APK"
          file "$APK"
          echo "=== APK signature verification ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "=== APK alignment ==="
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          echo "=== APK manifest metadata ==="
          "$BUILD_TOOLS/aapt" dump badging "$APK" | head -n 20
          echo "=== Manifest SDK and package fields ==="
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -E -A 3 -B 2 'uses-sdk|versionCode|versionName|package=' || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}
          name: Blueprint Debug Build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/debug/*.apk
